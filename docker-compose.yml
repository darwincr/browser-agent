services:
  opencode-a2a-xfce:
    build:
      context: .
      args:
        OPENCODE_A2A_VERSION: ${OPENCODE_A2A_VERSION:-1.1.1}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.59.0}
        CAMOUFOX_VERSION: ${CAMOUFOX_VERSION:-0.4.11}
    image: custom-opencode-a2a-xfce:latest
    shm_size: "2gb"
    ports:
      - "${A2A_HOST_PORT:-18000}:8000"
      - "${OPENCODE_HOST_PORT:-14096}:4096"
      - "${VNC_HOST_PORT:-5900}:5900"
      - "${NOVNC_HOST_PORT:-6080}:6080"
    environment:
      A2A_PUBLIC_URL: ${A2A_PUBLIC_URL:-http://localhost:18000}
      A2A_BROWSER_VIEW_URL: ${A2A_BROWSER_VIEW_URL:-http://localhost:6080/vnc.html}
      OPENCODE_HOST: ${OPENCODE_HOST:-0.0.0.0}
      # Browser/Marketplace research can run for many minutes; opencode-a2a's
      # default OpenCode upstream timeout is shorter than these jobs.
      OPENCODE_TIMEOUT: ${OPENCODE_TIMEOUT:-1800}
      OPENCODE_WORKSPACE_ROOT: ${OPENCODE_WORKSPACE_ROOT:-/workspaces}
      # Set true for image-based deployments with disposable persisted
      # workspaces, such as Coolify. Keep false for local bind-mounted checkout
      # development so startup does not rewrite ./workspaces on the host.
      OPENCODE_REFRESH_WORKSPACES_ON_START: ${OPENCODE_REFRESH_WORKSPACES_ON_START:-false}
      # Allow per-request workspace selection via metadata.opencode.directory.
      # Requested directories must resolve inside OPENCODE_WORKSPACE_ROOT.
      A2A_ALLOW_DIRECTORY_OVERRIDE: ${A2A_ALLOW_DIRECTORY_OVERRIDE:-true}
      # Replace this before exposing the service outside your machine.
      A2A_STATIC_AUTH_CREDENTIALS: ${A2A_STATIC_AUTH_CREDENTIALS:-[{"scheme":"bearer","token":"change-me","principal":"local"}]}
      # Optional: set a VNC password. If omitted, VNC runs without a password.
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      VNC_GEOMETRY: ${VNC_GEOMETRY:-1920x1080}
      VNC_DEPTH: ${VNC_DEPTH:-24}
      # Optional: max size for inline (base64) A2A file parts. Default 10 MiB.
      A2A_FILE_MAX_INLINE_BYTES: ${A2A_FILE_MAX_INLINE_BYTES:-10485760}
      # --- OpenCode provider secret (resolved from .env at compose time) ---
      # Required: backs the dr-openai LiteLLM provider.
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      XERO_USER: ${XERO_USER:-}
      SECRET_XERO_PASSWORD: ${SECRET_XERO_PASSWORD:-}
      FACEBOOK_CLI_MESSENGER_PIN: ${FACEBOOK_CLI_MESSENGER_PIN:-}
    volumes:
      - ./workspaces:/workspaces
      - ./data:/data
      - opencode-home:/home/opencode
      - ./docker/opencode.json:/home/opencode/.config/opencode/opencode.json:ro
      # opencode-litellm plugin: auto-loaded shim + vendored fork source.
      # OpenCode loads every file in ~/.config/opencode/plugins at startup.
      - ./docker/opencode-plugins:/home/opencode/.config/opencode/plugins:ro
      - ./docker/opencode-litellm:/home/opencode/.config/opencode/opencode-litellm:ro

volumes:
  opencode-home:
